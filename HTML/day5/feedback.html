<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback</title>
</head>
<body>
    <h2>Feedback form</h2>
    <form>
         <label>Full Name:</label><br>
        <input type="text" name="fullname"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Mobile Number:</label><br>
        <input type="tel" name="mobile"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Course:</label><br>
        <select name="course">
            <option>Select Course</option>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>Python</option>
        </select>
        <br><br>

        <label>Rate Our Training:</label><br>
        <input type="radio" name="rating"> Excellent
        <input type="radio" name="rating"> Good
        <input type="radio" name="rating"> Average
        <input type="radio" name="rating"> Poor
        <br><br>

        <label>What did you like?</label><br>
        <input type="checkbox" name="like" value="Teaching"> Teaching
        <input type="checkbox" name="like" value="Content"> Content
        <input type="checkbox" name="like" value="Environment"> Environment
        <input type="checkbox" name="like" value="Support"> Support
        <br><br>

        <label>Suggestions:</label><br>
        <textarea name="suggestions" rows="5" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit Feedback">
        <input type="reset" value="Reset">

    </form>
</body>
</html>
