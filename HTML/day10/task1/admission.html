<!DOCTYPE html>
<html>
<head>
    <title>Admission portal</title>
</head>
<body>

<h2>Engineering College Admission Portal</h2>

<form>

    <label>Student Name:</label><br>
    <input type="text" name="student_name"><br><br>

    <label>Father Name:</label><br>
    <input type="text" name="father_name"><br><br>

    <label>Mother Name:</label><br>
    <input type="text" name="mother_name"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Phone:</label><br>
    <input type="tel" name="phone"><br><br>

    <label>Date of Birth:</label><br>
    <input type="date" name="dob"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <br><br>

    <label>Department:</label><br>
    <select name="department">
        <option>Select Department</option>
        <option>Computer Science Engineering</option>
        <option>Information Technology</option>
        <option>Electronics and Communication</option>
        <option>Mechanical Engineering</option>
        <option>Civil Engineering</option>
    </select>
    <br><br>

    <label>Percentage:</label><br>
    <input type="number" name="percentage" placeholder="Enter Percentage">
    <br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="30"></textarea>
    <br><br>

    <label>Passport Size Photo:</label><br>
    <input type="file" name="photo">
    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <br><br>
    <table border="2">
        <thead>
            <th>Application id</th>
            <th>Student name</th>
            <th>Department</th>
            <th>percentage</th>
            <th>Email</th>
            <th>Admission status</th>
        </thead>
        <tbody>
            <tr>
                <td>6724</td>
                <td>Dhanaseelan</td>
                <td>Computer Science Engineering</td>
                <td>dhdhd@gmail.com</td>
                <td>processing</td>
            </tr>
        </tbody>
    </table>

</form>

</body>
</html>
