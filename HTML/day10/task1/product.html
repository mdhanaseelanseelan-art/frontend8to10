<!DOCTYPE html>
<html>
<head>
    <title>Product Registration Form</title>
</head>
<body>

<h2>Product Registration Form</h2>

<form>

    <label for="">Product ID:</label><br>
    <input type="text" id="" name=""><br><br>

    <label for="pname">Product Name:</label><br>
    <input type="text" id="pname" name=""><br><br>

    <label for="brand">Brand:</label><br>
    <input type="text" id="brand" name="brand"><br><br>

    <label for="category">Category:</label><br>
    <select id="category" name="category">
        <option>Select Category</option>
        <option>Laptop</option>
        <option>Mobile</option>
        <option>tab</option>
        <option>Monitor</option>
        <option>Accessories</option>
    </select><br><br>

    <label for="price">Price:</label><br>
    <input type="number" id="price" name="price"><br><br>

    <label for="quantity">Quantity:</label><br>
    <input type="number" id="quantity" name="quantity"><br><br>

    <label for="supplier">Supplier:</label><br>
    <input type="text" id="supplier" name="supplier"><br><br>

    <label for="description">Product Description:</label><br>
    <textarea id="description" name="description" rows="4" cols="30"></textarea><br><br>

    <label for="image">Product Image:</label><br>
    <input type="file" id="image" name="image"><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>
<table border="2">
    <thead>
        <th>Product ID</th>
        <th>Product Name</th>
        <th>Brand</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Stock Status</th>
    </thead>
    <tbody>
        <tr>
            <td>72-801</td>
            <td>Laptop</td>
            <td>SAMSUNG</td>
            <td>1,00,000</td>
            <td>1</td>
            <td>2026 manufacture</td>
        </tr>
    </tbody>
</table>

</body>
</html>
