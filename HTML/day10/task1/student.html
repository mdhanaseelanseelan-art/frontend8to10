<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration</title>
</head>
<body>
    <header>
        <h2>STUDENT REGISTRATION</h2>
    </header>
    <form>
        <label for="student name">Student name</label>
        <input type="text" name="" id="student name" >
        <br/><br>
        <label for="Email">Enter the email</label>
        <input type="text" name="" id="Email">
        <br>
        <label for="user password">Enter the password</label>
        <input type="text" name="" id="user password">
        <br><br>
        <label for="mobile">Enter mobile number</label>
        <input type="tel" name="" id="mobile" maxlength="10">
        <br><br>
        <label for="user age">Enter the age</label>
        <input type="number" name="" id="user age" max="2" min="1">
        <br><br>
        <label for="">Gender</label>
        <input type="radio" name="Gender" >male
        <input type="radio" name="Gender" >female
        <input type="radio" name="Gender" >other
        <br><br>
        <label>Skills</label>
        <input type="checkbox" >Html
        <input type="checkbox" >css
        <input type="checkbox" >js
        <input type="checkbox" >React
        <br><br>
        <label for="">course </label>
        <select name="course" id="">
            <option>select course</option>
            <option value="">Full stack</option>
            <option value="">Data Analytics</option>
            <option value="">Digital Marketing</option>
        </select>
        <br><br>
        
        <label for="">Address</label >
        <textarea rows="4" cols="30" placeholder="enter the address"></textarea>
        <br><br>
        <label>Profile Image Upload:</label><br>
        <input type="file"><br><br>

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>

    </form>
    <table border="2">
        <thead>
            <th>Student name</th>
            <th>course</th>
            <th>email</th>
            <th>mobile number</th>
            <th>status</th>
</thead>

            </tr>

        </tbody>
    </table>
    
    
</body>
</html>
