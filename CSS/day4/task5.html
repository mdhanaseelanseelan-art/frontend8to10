<!DOCTYPE html>
<html>
<head>
    <title>hide box</title>
<style>
.container{
    display:flex;
    gap:20px;
}

.card{
    width:180px;
    height:120px;
    background:skyblue;
    border:2px solid blue;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}


.hide-display{
    display:none;
}


.hide-visibility{
    visibility:hidden;
}
</style>
</head>
<body>

<div class="container">
    <div class="card">Card 1</div>

    <div class="card hide-display">Card 2</div>

    <div class="card hide-visibility">Card 3</div>

    <div class="card">Card 4</div>
</div>

</body>
</html>
