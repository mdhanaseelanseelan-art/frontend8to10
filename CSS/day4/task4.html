<!DOCTYPE html>
<html>
<head>
<style>
.box{
    width:150px;
    height:100px;
    color:white;
    text-align:center;
    line-height:100px;
    margin:10px;
}

.one{
    background:red;
}

.two{
    background:green;
    display:none;
}

.three{
    background:blue;
    visibility:hidden;
}
</style>
</head>
<body>

<div class="box one">Visible</div>

<div class="box two">Display None</div>

<div class="box three">Visibility Hidden</div>

<div class="box one">Last Box</div>

</body>
</html>
