```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Hover Animation</title>

    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;

            /* Transition */
            transition: 0.5s;
        }

        button:hover {
            /* Change background color */
            background-color: black;

            /* Change text color */
            color: white;

            /* Scale button */
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h2>Button Hover Animation</h2>

    <button>Login</button>
    <button>Register</button>
    <button>Submit</button>
    <button>Save</button>
    <button>Delete</button>

</body>
</html>
