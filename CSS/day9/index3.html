```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 50px;
        }

        .card {
            width: 220px;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;

            /* Smooth animation */
            transition: 0.4s;
        }

        /* Lift effect */
        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            margin: 15px 0 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: green;
        }

        .card button {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .card button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="products">

        <!-- Product 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/220x180" alt="Product Image">
            <h3>Smart Watch</h3>
            <p class="price">₹2,999</p>
            <button>Buy</button>
        </div>

        <!-- Product 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/220x180" alt="Product Image">
            <h3>Headphones</h3>
            <p class="price">₹1,499</p>
            <button>Buy</button>
        </div>

        <!-- Product 3 -->
        <div class="card">
            <img src="https://via.placeholder.com/220x180" alt="Product Image">
            <h3>Backpack</h3>
            <p class="price">₹999</p>
            <button>Buy</button>
        </div>

        <!-- Product 4 -->
        <div class="card">
            <img src="https://via.placeholder.com/220x180" alt="Product Image">
            <h3>Bluetooth Speaker</h3>
            <p class="price">₹1,999</p>
            <button>Buy</button>
        </div>

    </div>

</body>
</html>
