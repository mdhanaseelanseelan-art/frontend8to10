<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        .students {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 50px;
        }

        .card {
            width: 220px;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px gray;

            /* Smooth animation */
            transition: 0.5s;
        }

        /* Zoom + Move Up */
        .card:hover {
            transform: scale(1.05) translateY(-8px);
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        .card h2 {
            margin: 15px 0 10px;
        }

        .card p {
            margin: 8px;
            color: #555;
        }
    </style>
</head>

<body>

</body>
