<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Cards</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Desktop Background */
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Flexbox Container */
        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* Product Card */
        .product-card {
            width: calc(25% - 20px);
            background-color: #f5f5f5;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h2 {
            margin: 15px 0 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-btn {
            padding: 10px 20px;
            border: none;
            background-color: black;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Tablet - 2 Cards Per Row */
        @media (max-width: 768px) {

            body {
                background-color: lightblue;
            }

            .product-card {
                width: calc(50% - 20px);
            }

        }

        /* Mobile - 1 Card Per Row */
        @media (max-width: 576px) {

            body {
                background-color: lightgreen;
            }

            .product-card {
                width: 100%;
            }

        }

    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="product-container">

        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?1">
            <h2>Smart Watch</h2>
            <p class="price">₹1,999</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?2">
            <h2>Headphones</h2>
            <p class="price">₹1,499</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?3">
            <h2>Keyboard</h2>
            <p class="price">₹999</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 4 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?4">
            <h2>Mouse</h2>
            <p class="price">₹599</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 5 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?5">
            <h2>Backpack</h2>
            <p class="price">₹1,299</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 6 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?6">
            <h2>Sports Shoes</h2>
            <p class="price">₹2,499</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 7 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?7">
            <h2>Bluetooth Speaker</h2>
            <p class="price">₹1,799</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 8 -->
        <div class="product-card">
            <img src="https://picsum.photos/300/200?8">
            <h2>Power Bank</h2>
            <p class="price">₹899</p>
            <button class="buy-btn">Buy Now</button>
        </div>

    </div>

</body>
</html>
