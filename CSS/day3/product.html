<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <style>
        body{
            background-color: rgb(117, 91, 91);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .product{
            width: 300px;
            height: 500px;

            border: 3px solid blue;

        .price {
           width: 100;
            height: 50;
            border: 3px solid red;
            padding: 8px;
        }
        h2 {
             border: 2px solid green;
            background-color: lightyellow;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="product">

        <img src="assets/images/images1.jpg" alt="SAMSUNG" width="100" height="100">
        

        <h2>Mobile Phone</h2>

        <div class="price">Price: ₹1,00,000</div>

        <p>
            True confidence takes shape with the new Galaxy Z Fold8 Ultra. Engineered to be Ultra powerful and meet your every need, as you orchestrate multiple demands at once without missing a beat.
        </p>

        <button>Buy Now</button>

    </div>
