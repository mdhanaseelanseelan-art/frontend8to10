<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Colored Boxes</title>

    <style>
        .box3 {
            background-color: lightgreen;
            color: black;
            width: 300px;
            height: 120px;
            text-align: center;
        }

        .box4 {
            background-color: lightcoral;
            color: white;
            width: 300px;
            height: 120px;
            text-align: center;
        }

        .box5 {
            background-color: lightseagreen;
            color: white;
            width: 300px;
            height: 120px;
            text-align: center;
        }
    </style>
</head>
<body>
    <center>

    
    <div style="background-color:lightblue; color:black; width:300px; height:120px; text-align:center;">
        <h2>Box 1</h2>
        <p>This is the first colored box.</p>
    </div>

    <br>

    
    <div style="background-color:lightyellow; color:black; width:300px; height:120px; text-align:center;">
        <h2>Box 2</h2>
        <p>This is the second colored box.</p>
    </div>

    <br>


    <div class="box3">
        <h2>Box 3</h2>
        <p>This is the third colored box.</p>
    </div>

    <br>

    
    <div class="box4">
        <h2>Box 4</h2>
        <p>This is the fourth colored box.</p>
    </div>

    <br>

    
    <div class="box5">
        <h2>Box 5</h2>
        <p>This is the fifth colored box.</p>
    </div>
    </center>

</body>
</html>
