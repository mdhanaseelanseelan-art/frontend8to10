
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two Column Layout</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-sm ">

        <div class="row gap-3">

            
            <div class="col-6 bg-primary text-white p-5 w-25 ">
                <h2>Left Section</h2>
                <p>
                    This is the left side  layout.
                </p>
            </div>

            
            <div class="col-6 bg-success text-white p-5 w-25">
                <h2>Right Section</h2>
                <p>
                    This is the right side  layout.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
