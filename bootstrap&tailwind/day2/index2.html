<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two Column Layout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <div class="row">

            <!-- Left Column -->
            <div class="col-6 p-4 bg-primary text-white">
                <h2>Left Section</h2>
                <p>
                    This is the left column.
                </p>
            </div>

            <!-- Right Column -->
            <div class="col-6 p-4 bg-success text-white">
                <h2>Right Section</h2>
                <p>
                    This is the right column.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
