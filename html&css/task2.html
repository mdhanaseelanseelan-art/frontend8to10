<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Layout</title>
    <link rel="stylesheet" href="assets/css/style2.css">
</head>
<body>
    <center>

    <h1>Online Shopping Products</h1>
    
</center>

    <div class="product-card">
        <img src="assets/css/images/image1.webp" alt="Product 1" width="200" height="200">
        <h3>Wireless Mouse</h3>
        <p>₹499</p>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="assets/css/images/images2.jpg" alt="Product 2">
        <h3>Keyboard</h3>
        <p>₹899</p>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="assets/css/images/images3.jpg" alt="Product 3">
        <h3>Headphones</h3>
        <p>₹1,299</p>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="assets/css/images/images4.jpg" alt="Product 4">
        <h3>Smart Watch</h3>
        <p>₹2,499</p>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="assets/css/images/image-5.jpg" alt="Product 5">
        <h3>Bluetooth Speaker</h3>
        <p>₹1,999</p>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="assets/css/images/images6.webp" alt="Product 6" height="200" width="200">
        <h3>USB Drive</h3>
        <p>₹699</p>
        <button>Buy Now</button>
    </div>

</body>
</html>
